[build]
  # `prisma generate` also runs via postinstall; it is repeated here so the
  # client is regenerated even when the install step is restored from cache.
  # It reads schema.prisma only and never connects, so it works before the
  # site's environment variables are populated.
  command = "pnpm prisma generate && pnpm build"
  publish = ".next"

# ── Macro data refresh ───────────────────────────────────────────────────────
# The scores are only as fresh as IndicatorValue, which is filled by
# /api/cron/refresh-macro. Netlify's UI-scheduled functions cannot call an app
# route directly, so drive it from any scheduler (Netlify scheduled function,
# GitHub Actions cron, cron-job.org) with the shared secret:
#
#   GET https://<site>/api/cron/refresh-macro?secret=$CRON_SECRET
#
# IMPORTANT: the OECD rate-limits hard and answers a bare 500 as often as a 429
# when it throttles. Pulling all five datasets in one call needs ~30s of
# deliberate spacing, which exceeds Netlify's 26s synchronous function ceiling.
# Schedule them one at a time instead, a few minutes apart:
#
#   ?dataset=cpi&fred=0
#   ?dataset=coreCpi&fred=0
#   ?dataset=unemployment&fred=0
#   ?dataset=interestRate&fred=0
#   ?dataset=gdpQoQ&fred=0
#   (no parameters, once a day, for FRED + everything)
#
# Twice daily is ample: these are monthly and quarterly series. Nothing is
# gained by polling faster than the publication calendar.

# Required environment variables, set in Site settings -> Environment variables:
#
#   DATABASE_URL  Neon POOLED connection (host contains `-pooler`)
#   DIRECT_URL    Neon UNPOOLED connection — used by `prisma migrate` only
#
# Everything else is optional: each integration key (FRED, Finnhub, Marketaux,
# NewsAPI, Groq, Perplexity, Anthropic, FXMacroData, MetaApi) enables one
# feature, and a missing key disables that feature rather than breaking a page.
#
# The build itself needs NO environment variables — pages render per request.

[build.environment]
  NODE_VERSION = "22"
  # pnpm 10 blocks postinstall scripts by default; the allowlist lives in
  # package.json under "pnpm.onlyBuiltDependencies". Prisma needs its engines.
  PNPM_VERSION = "10"

# Netlify's Next.js runtime handles App Router, Server Components, route
# handlers and ISR. Installed automatically for Next projects, declared here
# so the dependency is explicit.
[[plugins]]
  package = "@netlify/plugin-nextjs"
