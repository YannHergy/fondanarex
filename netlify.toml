[build]
  command = "pnpm prisma generate && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # pnpm 10 blocks postinstall scripts by default; the allowlist lives in
  # package.json under "pnpm.onlyBuiltDependencies". Prisma needs its engines.
  PNPM_VERSION = "10"

# Netlify's Next.js runtime handles App Router, Server Components, route
# handlers and ISR. Installed automatically for Next projects, declared here
# so the dependency is explicit.
[[plugins]]
  package = "@netlify/plugin-nextjs"
